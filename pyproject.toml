[project]
name = "srq-rainfall"
version = "0.1.0"
description = "Hourly Sarasota County Water Atlas rainfall report published to README.md."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
]

[project.scripts]
srq-rainfall = "srq_rainfall:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
